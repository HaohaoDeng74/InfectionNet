<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10243a">
  <meta name="description" content="感染免疫多组学研究文献导航：追踪真实论文、脓毒症研究与微生物单细胞技术。">
  <title>InfectionNet · 感染免疫文献导航</title>
  <style>
    :root{color-scheme:light;--ink:#10243a;--muted:#657487;--line:#dce4e9;--paper:#f5f8f8;--card:#fff;--blue:#176b87;--mint:#c8f1df;--coral:#e86f51;--shadow:0 14px 38px #10243a0d}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif} button,input{font:inherit} a{color:inherit}
    .top{background:var(--ink);color:#f5fbff;padding:17px max(22px,calc((100vw - 1240px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:750;letter-spacing:.02em}.brand span{color:#7ed6b3}.top-note{color:#bfd0dc;font-size:13px}
    main{max-width:1240px;margin:0 auto;padding:38px 22px 60px}.intro{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;margin-bottom:25px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--blue);font-weight:750}.intro h1{font-size:clamp(28px,4vw,43px);line-height:1.15;letter-spacing:-.035em;margin:9px 0 9px}.intro p{max-width:720px;margin:0;color:var(--muted)}.updated{text-align:right;color:var(--muted);font-size:13px;white-space:nowrap}.updated strong{display:block;color:var(--ink);font-size:15px}
    .focus{display:flex;gap:10px;align-items:center;background:#e9f5f0;border:1px solid #d2e9de;border-radius:10px;padding:12px 15px;margin-bottom:20px;font-size:14px}.focus b{color:#176344}.controls{display:grid;grid-template-columns:minmax(230px,1fr) auto auto;gap:10px;margin:0 0 13px}.search{width:100%;border:1px solid var(--line);background:white;border-radius:9px;padding:11px 14px;outline:none}.search:focus{border-color:#5ba8af;box-shadow:0 0 0 3px #5ba8af22}.select,.refresh{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 13px;color:var(--ink)}.refresh{cursor:pointer}.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.tab{flex:none;border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:999px;cursor:pointer;color:#516274}.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:white}
    .status{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 1px;color:var(--muted);font-size:13px}.status strong{color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.paper{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 19px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:245px}.paper-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.journal{font-size:12px;color:var(--blue);font-weight:750;letter-spacing:.035em}.paper-date{font-size:12px;color:var(--muted);white-space:nowrap}.paper h2{font-size:19px;line-height:1.33;margin:10px 0 7px;letter-spacing:-.015em}.authors{font-size:13px;color:var(--muted);margin:0 0 9px}.abstract{font-size:14px;color:#3f5062;margin:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}.tag{font-size:12px;background:#edf3f5;border-radius:5px;padding:3px 8px;color:#446075}.paper-actions{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;align-items:center}.detail{border:0;background:none;padding:0;color:var(--blue);font-weight:700;cursor:pointer}.ids{font-size:12px;color:#758496}.empty{grid-column:1/-1;text-align:center;padding:48px 20px;border:1px dashed #b8c8cf;border-radius:12px;color:var(--muted);background:#fff}
    footer{border-top:1px solid var(--line);margin-top:28px;padding-top:16px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}.footer-links{display:flex;gap:14px}.footer-links a{color:var(--blue)}
    dialog{border:0;border-radius:14px;padding:0;width:min(760px,calc(100vw - 28px));max-height:88vh;box-shadow:0 28px 90px #07162555;color:var(--ink)}dialog::backdrop{background:#0a1c2bb3}.modal{padding:25px 27px 28px;overflow:auto;max-height:88vh}.modal-head{display:flex;justify-content:space-between;gap:20px;align-items:start}.close{border:1px solid var(--line);border-radius:8px;background:white;padding:5px 11px;cursor:pointer}.modal h2{font-size:25px;line-height:1.3;margin:13px 0 8px}.meta{color:var(--muted);font-size:14px}.section{border-top:1px solid var(--line);padding-top:16px;margin-top:19px}.section h3{font-size:14px;margin:0 0 7px}.section p{margin:0;color:#405165;font-size:15px;white-space:pre-wrap}.structured{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fact{background:#f3f7f7;padding:13px;border-radius:9px}.fact strong{font-size:13px;display:block;margin-bottom:5px}.fact span{font-size:14px;color:#475a6c}.links{display:flex;gap:12px;flex-wrap:wrap}.links a{color:var(--blue);font-weight:700}
    @media(max-width:760px){main{padding:26px 16px 40px}.intro{grid-template-columns:1fr}.updated{text-align:left}.controls{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.grid{grid-template-columns:1fr}.paper{min-height:0}.top{padding:15px 16px}.top-note{font-size:12px;text-align:right}.structured{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">Infection<span>Net</span></div><div class="top-note">感染 · 免疫 · 多组学 / 文献索引</div></header>
  <main>
    <section class="intro"><div><div class="eyebrow">Research literature navigator</div><h1>感染免疫研究，沿着证据找下去。</h1><p>持续追踪感染与免疫多组学论文。按专题、时间和关键词筛选；每条记录保留可回溯的来源链接。</p></div><div class="updated"><span>数据快照更新</span><strong id="updated">读取中…</strong></div></section>
    <div class="focus"><b>本周更新</b><span>按 Europe PMC 首次发表日期筛选最近 7 个 UTC 日（含今天）；预印本与正式发表版本可能分别出现。</span></div>
    <section aria-label="文献筛选">
      <div class="controls"><input class="search" id="search" type="search" placeholder="搜索标题、摘要、作者或 DOI" aria-label="搜索文献"><select class="select" id="year" aria-label="按年份筛选"><option value="">全部年份</option></select><select class="select" id="sort" aria-label="排序"><option value="new">最新优先</option><option value="old">最早优先</option></select></div>
      <div class="tabs" role="group" aria-label="专题筛选"><button class="tab" data-topic="all" aria-pressed="true">全部文献</button><button class="tab" data-topic="week" aria-pressed="false">一周内</button><button class="tab" data-topic="sepsis" aria-pressed="false">脓毒症</button><button class="tab" data-topic="microbial_single_cell" aria-pressed="false">微生物单细胞</button><button class="tab" data-topic="infection_omics" aria-pressed="false">感染免疫多组学</button></div>
    </section>
    <div class="status"><span id="count">正在读取文献索引…</span><span>文献元数据：Europe PMC · 主题标签按检索式归类</span></div>
    <section class="grid" id="papers" aria-live="polite"></section>
    <footer><span>InfectionNet · 供科研文献发现与阅读使用，不构成临床建议。 <span id="icpFiling"></span></span><span class="footer-links"><a href="https://europepmc.org/" target="_blank" rel="noreferrer">数据源 Europe PMC</a><a href="https://github.com/HaohaoDeng74/InfectionNet" target="_blank" rel="noreferrer">项目源码</a></span></footer>
  </main>
  <dialog id="paperDialog" aria-labelledby="dialogTitle"><article class="modal"><div class="modal-head"><div id="dialogKicker" class="journal"></div><button class="close" id="closeDialog" aria-label="关闭详情">关闭</button></div><h2 id="dialogTitle"></h2><div id="dialogMeta" class="meta"></div><div id="dialogBody"></div></article></dialog>
  <script>
    const labels={sepsis:'脓毒症',microbial_single_cell:'微生物单细胞',infection_omics:'感染免疫多组学',week:'一周内'};
    let papers=[]; let topic='all';
    const el=(id)=>document.getElementById(id);
    const safe=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const dateOf=p=>p.firstPublicationDate||p.pubDate||'';
    function weekOld(p,now=Date.now()){
      const value=p.firstPublicationDate;
      if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;
      const date=Date.parse(value+'T00:00:00Z');
      if(!Number.isFinite(date)||new Date(date).toISOString().slice(0,10)!==value)return false;
      const today=Math.floor(now/86400000)*86400000;
      return date>=today-6*86400000&&date<=today;
    }
    function topicList(p,now=Date.now()){
      const t=[...new Set((Array.isArray(p.topics)?p.topics:[]).filter(t=>t!=='week'))];
      if(weekOld(p,now))t.push('week');
      return t;
    }
    function render(){
      const now=Date.now(),q=el('search').value.trim().toLowerCase(),year=el('year').value,sort=el('sort').value;
      let rows=papers.filter(p=>topic==='all'||topicList(p,now).includes(topic));
      if(q)rows=rows.filter(p=>[p.title,p.abstractText,p.authorString,p.doi,p.journalTitle].join(' ').toLowerCase().includes(q));
      if(year)rows=rows.filter(p=>String(p.pubYear||'')===year);
      rows.sort((a,b)=>sort==='new'?dateOf(b).localeCompare(dateOf(a)):dateOf(a).localeCompare(dateOf(b)));
      el('count').innerHTML=`显示 <strong>${rows.length}</strong> / ${papers.length} 篇`;
      if(!rows.length){el('papers').innerHTML='<div class="empty">没有找到匹配的论文。试试更短的关键词，或切换专题。</div>';return}
      el('papers').innerHTML=rows.map((p,i)=>`<article class="paper"><div class="paper-top"><div class="journal">${safe(p.journalTitle||p.source||'研究论文')}</div><div class="paper-date">${safe(dateOf(p)||p.pubYear||'日期待补')}</div></div><h2>${safe(p.title||'无标题')}</h2><p class="authors">${safe(p.authorString||'作者信息待补')} · ${safe(p.pubYear||'年份待补')}</p><p class="abstract">${safe(p.abstractText||'摘要暂缺，可通过文献来源链接查看论文详情。')}</p><div class="tags">${topicList(p,now).map(t=>`<span class="tag">${safe(labels[t]||t)}</span>`).join('')}${p.isOpenAccess==='Y'?'<span class="tag">开放全文</span>':''}</div><div class="paper-actions"><button class="detail" data-index="${i}" data-key="${safe(p.id||'')}">查看文献详情</button><span class="ids">${p.pmid?'PMID '+safe(p.pmid):safe(p.doi||'')}</span></div></article>`).join('');
      el('papers').querySelectorAll('.detail').forEach(btn=>btn.addEventListener('click',()=>openPaper(papers.find(p=>String(p.id)===btn.dataset.key))));
    }
    function openPaper(p){if(!p)return;el('dialogKicker').textContent=[p.journalTitle,p.pubYear].filter(Boolean).join(' · ');el('dialogTitle').textContent=p.title||'无标题';el('dialogMeta').textContent=[p.authorString,p.doi?'DOI: '+p.doi:'',p.pmid?'PMID: '+p.pmid:''].filter(Boolean).join(' · ');
      const notes=p.analysis||{};const abstract=p.abstractText||'Europe PMC 当前未提供摘要。请通过下方原始来源链接查看。';
      el('dialogBody').innerHTML=`<div class="section"><h3>摘要</h3><p>${safe(abstract)}</p></div><div class="section"><h3>结构化速读</h3><div class="structured"><div class="fact"><strong>研究设计 / 数据类型</strong><span>${safe(notes.design||p.studyType||'自动索引尚未提供；以原文方法为准。')}</span></div><div class="fact"><strong>研究主题</strong><span>${safe(topicList(p).map(t=>labels[t]||t).join('、')||'感染免疫')}</span></div><div class="fact"><strong>核心发现</strong><span>${safe(notes.finding||'尚无经过人工核对的解读。请先阅读摘要与原文。')}</span></div><div class="fact"><strong>阅读提示</strong><span>${safe(notes.caveat||'索引标签由检索式自动归类，不代表质量评价；重要结论请回到原文核对。')}</span></div></div></div><div class="section"><h3>原文与数据库记录</h3><div class="links">${p.doi?`<a href="https://doi.org/${encodeURIComponent(p.doi)}" target="_blank" rel="noreferrer">期刊 / DOI</a>`:''}${p.pmid?`<a href="https://pubmed.ncbi.nlm.nih.gov/${encodeURIComponent(p.pmid)}/" target="_blank" rel="noreferrer">PubMed</a>`:''}${p.pmcid?`<a href="https://pmc.ncbi.nlm.nih.gov/articles/${encodeURIComponent(p.pmcid)}/" target="_blank" rel="noreferrer">PMC 全文</a>`:''}<a href="${safe(p.sourceUrl||'https://europepmc.org/') }" target="_blank" rel="noreferrer">Europe PMC</a></div></div>`;
      el('paperDialog').showModal();
    }
    el('closeDialog').addEventListener('click',()=>el('paperDialog').close());el('paperDialog').addEventListener('click',e=>{if(e.target===el('paperDialog'))el('paperDialog').close()});
    document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{topic=b.dataset.topic;document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',String(t===b)));render()}));
    ['search','year','sort'].forEach(id=>el(id).addEventListener(id==='search'?'input':'change',render));
    async function load(){try{const [res,configRes]=await Promise.all([fetch('./data/papers.json',{cache:'no-store'}),fetch('./data/site-config.json',{cache:'no-store'}).catch(()=>null)]);if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();if(!Array.isArray(data.papers)||data.record_count!==data.papers.length)throw new Error('Invalid snapshot');papers=data.papers;el('updated').textContent=data.updated_at?new Date(data.updated_at).toLocaleString('zh-CN',{dateStyle:'medium',timeStyle:'short'}):'等待首次更新';if(configRes&&configRes.ok){const config=await configRes.json();if(config.icp_record)el('icpFiling').innerHTML=`<a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer">${safe(config.icp_record)}</a>`}const age=Date.now()-Date.parse(data.updated_at);if(!Number.isFinite(age)||age>48*3600000)el('updated').textContent+=' · 快照可能已过期';if(data.bootstrap)document.querySelector('.focus span').textContent+=' 当前为 '+papers.length+' 条启动样本，完整快照需运行更新脚本生成。';const stats=Object.values(data.query_stats||{});if(stats.some(s=>s.truncated))document.querySelector('.focus span').textContent+=' 当前为限量发现快照，每专题最多 '+Math.max(...stats.map(s=>s.limit||0))+' 条，另保留人工指定文献。';const years=[...new Set(papers.map(p=>p.pubYear).filter(Boolean))].sort((a,b)=>b-a);el('year').innerHTML='<option value="">全部年份</option>'+years.map(y=>`<option value="${safe(y)}">${safe(y)}</option>`).join('');render()}catch(e){el('updated').textContent='索引暂不可用';el('count').textContent='文献索引读取失败；请稍后刷新。';el('papers').innerHTML='<div class="empty">暂时无法读取本地文献快照。刷新页面或检查部署时是否包含 data/papers.json。</div>';}}
    // Recompute on UTC day rollover, including a tab left open across midnight.
    let renderedDay=Math.floor(Date.now()/86400000);
    function refreshDay(){const day=Math.floor(Date.now()/86400000);if(day!==renderedDay){renderedDay=day;render()}}
    setInterval(refreshDay,60000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDay()});
    load();
  </script>
</body>
</html>
