name: Refresh literature snapshot

on:
  schedule:
    - cron: '15 17 * * *' # 01:15 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: literature-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch recent records from Europe PMC
        run: python scripts/update_literature.py
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/papers.json; then
            echo "Literature snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.json
          git commit -m "chore: refresh literature snapshot"
          git push
